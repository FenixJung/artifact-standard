(function(){
  var ATTRS=['aria-label','alt','title'];
  function swap(){
    var en=curLang()==='en';
    ATTRS.forEach(function(a){
      [].forEach.call(document.querySelectorAll('[data-en-'+a+']'),function(el){
        if(!el.hasAttribute('data-ko-'+a))el.setAttribute('data-ko-'+a,el.getAttribute(a)||'');

  $('e-out').addEventListener('click',pullOut);

  var menu=document.createElement('div');menu.className='e-menu';menu.hidden=true;menu.setAttribute('role','menu');document.body.appendChild(menu);
  var MENU=[
    {label:M('그룹으로 묶기','Group'),key:KEYS.g,run:groupSel,ok:function(){return selS.length>=2&&!!sameCont(selS);}},
    {label:M('그룹 풀기','Ungroup'),key:KEYS.ug,run:ungroupSel,ok:function(){return selS.length===1&&!!state.groups[selS[0].key];}},
    {label:M('그룹에서 빼기','Take out of group'),run:pullOut,ok:function(){var c=sameCont(selS);return !!(c&&blockBy.get(c.el));}},
    {label:M('앞 그룹에 넣기','Put in previous group'),run:function(){putInto('prev');},ok:function(){return !!neighborCont('prev');}},
    {label:M('뒤 그룹에 넣기','Put in next group'),run:function(){putInto('next');},ok:function(){return !!neighborCont('next');}},
    null,
    {label:M('복제하기','Duplicate'),key:KEYS.d,run:dupSel,ok:function(){return selS.length>0;}},
    {label:M('삭제하기','Delete'),key:KEYS.del,run:delSel,ok:function(){return selS.length>0;}},
    null,
    {label:M('그룹 안으로 들어가기','Go inside group'),key:M('더블클릭','Double-click'),run:function(){enterGroup(selS[0]);},ok:function(){var c=selS.length===1&&contBy.get(selS[0].el);return !!(c&&c.blocks.length);}},
    {label:M('한 단계 위 선택','Select parent'),run:function(){var p=parentBlock(selS[0]);if(entered&&p&&(p===entered||p.el.contains(entered.el))){entered.el.classList.remove('e-entered');entered=null;}if(p)setSel([p]);},ok:function(){return selS.length>0&&!!parentBlock(selS[0]);}},
    null,
    {label:function(){return allFree(selS)?M('자유 배치 끄기','Free placement off'):M('자유 배치 켜기','Free placement on');},run:function(){$('e-free').click();},ok:function(){return selS.length>0&&WIDE.matches;}},
    {label:M('원래대로','Reset'),run:function(){$('e-reset').click();},ok:function(){return selS.some(function(b){return state.free[b.key]||state.align[b.key];});}}
  ];
  function closeMenu(){menu.hidden=true;}
  function openMenu(x,y){
    menu.innerHTML='';
    MENU.forEach(function(m){
      if(!m){var s=document.createElement('div');s.className='e-msep';menu.appendChild(s);return;}
      var bt=document.createElement('button');bt.type='button';bt.className='e-mi';bt.setAttribute('role','menuitem');
      var l=document.createElement('span');l.textContent=say(typeof m.label==='function'?m.label():m.label);bt.appendChild(l);
      if(m.key){var k=document.createElement('kbd');k.textContent=say(m.key);bt.appendChild(k);}
      bt.disabled=!m.ok();
      bt.addEventListener('click',function(){closeMenu();m.run();});
      menu.appendChild(bt);
    });
    menu.hidden=false;
    var w=menu.offsetWidth, h=menu.offsetHeight;
    menu.style.left=Math.max(8,Math.min(x,window.innerWidth-w-8))+'px';
    menu.style.top=Math.max(8,Math.min(y,window.innerHeight-h-8))+'px';
    var first=menu.querySelector('.e-mi:not(:disabled)');if(first)first.focus();
  }
  document.addEventListener('contextmenu',function(e){
    if(!on)return;
    if(press||drag){e.preventDefault();return;}
    if(!WIDE.matches||inChrome(e.target))return;
    if(mode==='text'&&String(window.getSelection()||'').trim())return;
    var b=blockFrom(e.target);if(!b)return;
    e.preventDefault();
    if(selS.indexOf(b)<0)setSel([b]);
    openMenu(e.clientX,e.clientY);
  });
  document.addEventListener('pointerdown',function(e){if(!menu.hidden&&!menu.contains(e.target))closeMenu();},true);
  window.addEventListener('scroll',function(){if(!menu.hidden)closeMenu();},{passive:true});
  window.addEventListener('blur',closeMenu);
  function editInline(el,x,y){
    el.setAttribute('contenteditable','true');el.setAttribute('spellcheck','false');el.focus();
    try{var r=document.caretRangeFromPoint?document.caretRangeFromPoint(x,y):null;if(r&&el.contains(r.startContainer)){var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);}}catch(_){}
    function off(){el.removeEventListener('blur',off);if(mode!=='text'){el.removeAttribute('contenteditable');el.removeAttribute('spellcheck');}msg='';render();}
    el.addEventListener('blur',off);
  }
  document.addEventListener('dblclick',function(e){
    if(!on||!WIDE.matches)return;
    var viaHandle=e.target===handle||handle.contains(e.target);
    if(!viaHandle&&(mode!=='layout'||inChrome(e.target)))return;
    var u=viaHandle?handle._b:blockFrom(e.target);
    if(!u)return;
    var c=contBy.get(u.el);
    if(c&&c.blocks.length&&u!==entered&&(isUnit(u)||viaHandle)){
      e.preventDefault();
      var prev=entered;entered=u;var pick=viaHandle?null:blockFrom(e.target);entered=prev;
      enterGroup(u,pick);return;
    }
    if(viaHandle)return;
    var ed=edEl(e.target);
    if(ed&&u.el.contains(ed)){e.preventDefault();editInline(ed,e.clientX,e.clientY);msg=MSG.editing;render();return;}
    msg=MSG.demoText;render();
  });

  function docOrder(a,b){return a.el.compareDocumentPosition(b.el)&Node.DOCUMENT_POSITION_FOLLOWING?-1:1;}
  function startDrag(e){
    var b=press.b, id=press.id;press=null;
    if(selS.indexOf(b)<0)setSel([b]);
    var group=selS.filter(function(x){return x.cont===b.cont;});
    var free=!!state.free[b.key];
    group=group.filter(function(x){return !!state.free[x.key]===free;});
    if(group.indexOf(b)<0)group=[b];
    group.sort(docOrder);
    try{root.setPointerCapture(id);}catch(_){}
    root.classList.add('e-dragging');
    setHover(null);clearOv();ov.hidden=false;
    if(free)startFree(b,group,e);else startFlow(b,group,e);
  }
  function moveDrag(e){if(drag.kind==='flow')moveFlow(e);else moveFree(e);}
  function finishDrag(){
    root.classList.remove('e-dragging');
    BLOCKS.forEach(function(b){b.el.classList.remove('e-lift','e-dim');});
    if(drag&&drag.ghost&&drag.ghost.parentNode)drag.ghost.parentNode.removeChild(drag.ghost);
    if(drag&&drag.ins){drag.ins.forEach(function(n){if(n.parentNode)n.parentNode.removeChild(n);});}
    drag=null;clearOv();measure();
  }
  function cancelDrag(){
    if(!drag)return;
    if(drag.kind==='free')applyStyles();
    finishDrag();
  }
  function endDrag(e){if(drag.kind==='flow')endFlow(e);else endFree(e);}

  /* ---------- flow drag: line shows the drop spot, nothing moves until drop ---------- */
  function dirOf(c){
    var cs=getComputedStyle(c.el);
    if(cs.display.indexOf('grid')>=0)return cs.gridTemplateColumns.trim().split(/\s+/).length>1?'grid':'col';
    if(cs.display.indexOf('flex')>=0)return cs.flexDirection.indexOf('row')===0?'row':'col';
    var kids=[].slice.call(c.el.children);
    if(kids.length&&kids.every(function(n){return getComputedStyle(n).display.indexOf('inline')===0;}))return 'row';
    return 'col';
  }
  function startFlow(b,group,e){
    var r=b.el.getBoundingClientRect();
    var g=document.createElement('div');g.className='e-ghost';
    var w=Math.min(r.width,420), h=Math.min(r.height,120);
    g.style.width=w+'px';g.style.height=h+'px';
    g.textContent=(group.length>1?group.length+tx('개 · ',' · '):'')+norm(textOf(b.el,curLang()==='en'?'ko':'en')).slice(0,80);
    document.body.appendChild(g);
    var ox=Math.min(Math.max(8,e.clientX-r.left),w-8), oy=Math.min(Math.max(8,e.clientY-r.top),h-8);
    group.forEach(function(x){x.el.classList.add('e-dim');});
    var ins=document.createElement('div');ins.className='e-ins';ins.hidden=true;document.body.appendChild(ins);
    var il=document.createElement('div');il.className='e-ins-lab';il.hidden=true;document.body.appendChild(il);
    drag={kind:'flow',b:b,group:group,c:b.cont,dir:dirOf(b.cont),ghost:g,ox:ox,oy:oy,ins:[ins,il],t:null};
    moveFlow(e);
  }
  function kidsOf(c){
    return [].slice.call(c.el.children).filter(function(n){
      return n.classList.contains('e-row')||(blockBy.has(n)&&blockBy.get(n).cont===c);
    });
  }
  function flowTarget(x,y){
    var d=drag, c=d.c, dragged=d.group.map(function(b){return b.el;});
    var items=kidsOf(c).filter(function(n){return dragged.indexOf(n)<0;}).map(function(n){return {n:n,r:n.getBoundingClientRect(),row:n.classList.contains('e-row')};});
    if(!items.length)return null;
    var cr=c.el.getBoundingClientRect(), cs=getComputedStyle(c.el);
    var cl=cr.left+parseFloat(cs.paddingLeft), crt=cr.right-parseFloat(cs.paddingRight);
    if(d.dir==='col'){
      var hit=null;items.forEach(function(it){if(y>=it.r.top&&y<=it.r.bottom)hit=it;});
      if(hit&&!c.page&&d.group.length===1&&!/^(UL|OL)$/.test(c.el.tagName)){
        if(hit.row){
          var kids=[].slice.call(hit.n.children).filter(function(n){return dragged.indexOf(n)<0;});
          if(kids.length<3&&kids.length){
            var best=kids[0], bd=1e9;
            kids.forEach(function(n){var q=n.getBoundingClientRect(), dd=Math.abs(x-(q.left+q.right)/2);if(dd<bd){bd=dd;best=n;}});
            var q=best.getBoundingClientRect(), left=x<(q.left+q.right)/2;
            return {type:'row',ref:best,side:left?'left':'right',line:{x:left?q.left-4:q.right+4,y:q.top,h:q.height},label:tx('옆에 나란히','Side by side')};
          }
        }else if(hit.r.width>=240&&!hit.n.classList.contains('e-row')){
          var zone=hit.r.width*0.22;
          if(x<hit.r.left+zone)return {type:'side',ref:hit.n,side:'left',line:{x:hit.r.left-4,y:hit.r.top,h:hit.r.height},label:tx('옆에 나란히','Side by side')};
          if(x>hit.r.right-zone)return {type:'side',ref:hit.n,side:'right',line:{x:hit.r.right+4,y:hit.r.top,h:hit.r.height},label:tx('옆에 나란히','Side by side')};
        }
      }
      var before=null, prev=null;
      for(var i=0;i<items.length;i++){if(y<(items[i].r.top+items[i].r.bottom)/2){before=items[i];prev=items[i-1]||null;break;}}
      var ly;
      if(before)ly=prev?(prev.r.bottom+before.r.top)/2:before.r.top-6;
      else ly=items[items.length-1].r.bottom+6;
      return {type:'insert',ref:before?before.n:null,line:{x:cl,y:ly-1.5,w:crt-cl}};
    }
    var best2=items[0], bd2=1e9;
    items.forEach(function(it){var dd=Math.hypot(x-(it.r.left+it.r.right)/2,y-(it.r.top+it.r.bottom)/2);if(dd<bd2){bd2=dd;best2=it;}});
    var after=x>(best2.r.left+best2.r.right)/2, idx=items.indexOf(best2);
    var ref=after?(items[idx+1]?items[idx+1].n:null):best2.n;
    return {type:'insert',ref:ref,line:{x:after?best2.r.right+4:best2.r.left-4,y:best2.r.top,h:best2.r.height}};
  }
  function moveFlow(e){
    var d=drag;
    d.ghost.style.left=(e.clientX-d.ox)+'px';d.ghost.style.top=(e.clientY-d.oy)+'px';
    var t=flowTarget(e.clientX,e.clientY);d.t=t;
    var ins=d.ins[0], il=d.ins[1];
    if(!t){ins.hidden=il.hidden=true;return;}
    ins.hidden=false;
    if(t.line.w!=null){ins.style.left=t.line.x+'px';ins.style.top=t.line.y+'px';ins.style.width=t.line.w+'px';ins.style.height='3px';}
    else{ins.style.left=(t.line.x-1.5)+'px';ins.style.top=t.line.y+'px';ins.style.width='3px';ins.style.height=t.line.h+'px';}
    if(t.label){il.hidden=false;il.textContent=t.label;il.style.left=t.line.x+'px';il.style.top=t.line.y+'px';}else il.hidden=true;
  }
  function flip(els,fn){
    var before=new Map();els.forEach(function(el){before.set(el,el.getBoundingClientRect());});
    fn();
    if(REDUCE.matches)return;
    els.forEach(function(el){
      var a=before.get(el), b=el.getBoundingClientRect(), dx=a.left-b.left, dy=a.top-b.top;
      if((Math.abs(dx)<1&&Math.abs(dy)<1)||!el.animate)return;
      try{el.animate([{translate:dx+'px '+dy+'px'},{translate:'0px 0px'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});}catch(_){}
    });
  }
  function endFlow(){
    var d=drag, t=d.t, c=d.c;
    if(!t){finishDrag();return;}
    var keys=d.group.map(function(b){return b.key;});
    var st=structOf(c).map(function(it){
      if(typeof it==='string')return keys.indexOf(it)>=0?null:it;
      var r=it.filter(function(k){return keys.indexOf(k)<0;});return r.length>1?r:(r.length?r[0]:null);
    }).filter(function(x){return x!=null;});
    function keyOfNode(n){return n.classList.contains('e-row')?n._keys:[blockBy.get(n).key];}
    function idxOf(k){for(var i=0;i<st.length;i++){var it=st[i];if(it===k||(Array.isArray(it)&&it.indexOf(k)>=0))return i;}return -1;}
    if(t.type==='insert'){
      var i=st.length;
      if(t.ref){var ks=keyOfNode(t.ref);for(var j=0;j<ks.length;j++){var ii=idxOf(ks[j]);if(ii>=0){i=ii;break;}}}
      st.splice.apply(st,[i,0].concat(keys));
    }else{
      var rk=blockBy.get(t.ref).key, at=idxOf(rk);
      if(at<0){finishDrag();return;}
      var it=st[at], arr=Array.isArray(it)?it.slice():[it];
      if(arr.length>=3){finishDrag();return;}
      var pos=arr.indexOf(rk)+(t.side==='right'?1:0);
      arr.splice(pos,0,keys[0]);
      st[at]=arr;
    }
    snap();setOrder(c,st);
    var els=c.blocks.map(function(b){return b.el;});
    flip(els,function(){applyLayout();});
    finishDrag();changed();
  }

  /* ---------- free drag: block follows the pointer, snaps to edges, centres, even gaps, grid ---------- */
  function startFree(b,group,e){
    var p0=group.map(function(x){return (state.free[x.key]||[0,0]).slice();});
    var f=state.free[b.key]||[0,0], r=rectP(b.el);
    var nat={l:r.l-f[0],t:r.t-f[1],w:r.w,h:r.h};
    var cands=candidatesFor(b,group);
    var xs=[], ys=[];
    cands.forEach(function(q){xs.push(q.l,(q.l+q.r)/2,q.r);ys.push(q.t,(q.t+q.b)/2,q.b);});
    var wb=contentBox(wrap);
    drag={kind:'free',b:b,group:group,p0:p0,f0:f.slice(),nat:nat,cands:cands,xs:xs,ys:ys,minL:wb.l,maxR:wb.r,x0:e.pageX,y0:e.pageY,cur:null};
  }
  function nearest(edges,lines){var b=null;edges.forEach(function(v){lines.forEach(function(L){var df=L-v;if(Math.abs(df)<=NEAR&&(!b||Math.abs(df)<Math.abs(b.d)))b={d:df,at:L};});});return b;}
  function moveFree(e){
    var d=drag, n=d.nat, cb=contentBox(d.b.cont.el);
    var dx=d.f0[0]+(e.pageX-d.x0), dy=d.f0[1]+(e.pageY-d.y0), gx=null, gy=null;
    function P(){return {l:n.l+dx,t:n.t+dy,r:n.l+dx+n.w,b:n.t+dy+n.h};}
    var a=nearest([n.l+dx,n.l+dx+n.w/2,n.l+dx+n.w],d.xs);
    if(a){dx+=a.d;gx=a.at;}
    else{
      var nb=neighbors(P(),d.cands), gL=nb.left?nb.left.d:null, gR=nb.right?nb.right.d:null, done=false;
      if(gL!=null&&gR!=null&&Math.abs(gL-gR)<=NEAR*2){dx+=(gR-gL)/2;done=true;}
      if(!done&&gL!=null)SCALE.forEach(function(v){if(!done&&Math.abs(gL-v)<=NEAR){dx+=v-gL;done=true;}});
      if(!done&&gR!=null)SCALE.forEach(function(v){if(!done&&Math.abs(gR-v)<=NEAR){dx+=gR-v;done=true;}});
      if(!done)dx=Math.round((n.l+dx-cb.l)/GRID)*GRID+cb.l-n.l;
    }
    var b2=nearest([n.t+dy,n.t+dy+n.h/2,n.t+dy+n.h],d.ys);
    if(b2){dy+=b2.d;gy=b2.at;}
    else{
      var nb2=neighbors(P(),d.cands), gU=nb2.up?nb2.up.d:null, gD=nb2.down?nb2.down.d:null, done2=false;
      if(gU!=null&&gD!=null&&Math.abs(gU-gD)<=NEAR*2){dy+=(gD-gU)/2;done2=true;}
      if(!done2&&gU!=null)SCALE.forEach(function(v){if(!done2&&Math.abs(gU-v)<=NEAR){dy+=v-gU;done2=true;}});
      if(!done2&&gD!=null)SCALE.forEach(function(v){if(!done2&&Math.abs(gD-v)<=NEAR){dy+=gD-v;done2=true;}});
      if(!done2)dy=Math.round(dy/GRID)*GRID;
    }
    var lo=d.minL-n.l, hi=d.maxR-(n.l+n.w);
    if(hi<lo){lo=0;hi=0;}
    if(dx<lo){dx=lo;gx=null;}
    if(dx>hi){dx=hi;gx=null;}
    if(n.t+dy<0)dy=-n.t;
    dx=Math.round(dx);dy=Math.round(dy);
    var ddx=dx-d.f0[0], ddy=dy-d.f0[1];
    d.cur=d.group.map(function(x,i){return [d.p0[i][0]+ddx,d.p0[i][1]+ddy];});
    d.group.forEach(function(x,i){var v=d.cur[i];x.el.style.transform='translate('+v[0]+'px,'+v[1]+'px)';});
    clearOv();
    if(gx!=null)guideX(gx);
    if(gy!=null)guideY(gy);
    var PP=P();
    drawDistances(PP,neighbors(PP,d.cands));
  }
  function endFree(){
    var d=drag;
    if(d.cur){snap();d.group.forEach(function(x,i){state.free[x.key]=d.cur[i];});applyStyles();finishDrag();changed();}
    else finishDrag();
  }

  function onWide(){if(!WIDE.matches&&mode==='layout')setMode('text');applyStyles();placeHandle();render();measure();}
  try{WIDE.addEventListener('change',onWide);}catch(e){try{WIDE.addListener(onWide);}catch(_){}}
  onLang(function(){if(!menu.hidden)closeMenu();render();measureSoon();});

  /* ---------- load saved edits, then show the toolbar to people who can edit ---------- */
  fetch('data/edits.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}).then(function(s){
    state=tidy(s);saved=js(state);
    try{
      var raw=sessionStorage.getItem(STASH);
      if(raw){
        var st=JSON.parse(raw), next=merge(tidy(JSON.parse(saved)),tidy(st.base),tidy(st.state));
        if(js(next)!==saved){state=next;dirty=true;msg=MSG.restored;}else sessionStorage.removeItem(STASH);
      }
    }catch(e){}
    applyAll();render();
  });
  var C=window.claude;
  if(C&&typeof C.use==='function'){
    C.use('artifact').then(function(a){
      if(!a)return;art=a;
      return C.use('user').then(function(u){return u&&typeof u.canEdit==='function'?u.canEdit():true;},function(){return true;}).then(function(ok){
        if(ok===false)return;bar.hidden=false;render();
      });
    },function(){});
  }
})();
</script>
